<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fortune's Weave Support Browser</title>
<style>
:root {
  --bg-1:#0f1627;
  --bg-2:#1b2742;
  --panel:#f4eedf;
  --panel-2:#fbf7ed;
  --ink:#1f2330;
  --muted:#6b6f79;
  --navy:#27395f;
  --navy-2:#354d7e;
  --gold:#d9b66c;
  --gold-deep:#b88a35;
  --gold-soft:#edd9ab;
  --green:#3b7f64;
  --purple:#7a5ca6;
  --brown:#6d5332;
  --shadow:0 14px 34px rgba(0,0,0,.22);
}

* { box-sizing:border-box; }

body {
  margin:0;
  font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at top, rgba(255,255,255,.08), transparent 32%),
    linear-gradient(180deg, rgba(255,255,255,.04), transparent 180px),
    linear-gradient(180deg, var(--bg-2), var(--bg-1));
  min-height:100vh;
}

body::before {
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.18;
  background-image:
    linear-gradient(transparent 96%, rgba(255,255,255,.1) 100%),
    linear-gradient(90deg, transparent 96%, rgba(255,255,255,.08) 100%);
  background-size:40px 40px, 40px 40px;
}

.shell {
  max-width:1220px;
  margin:0 auto;
  padding:30px 20px 48px;
  position:relative;
  z-index:1;
}

.banner {
  position:relative;
  overflow:hidden;
  background:
    linear-gradient(135deg, rgba(255,255,255,.10), rgba(255,255,255,.03)),
    linear-gradient(135deg, #1b2d52, #0f1830 70%);
  color:#f7f1e2;
  border:1px solid rgba(217,182,108,.45);
  border-radius:26px;
  padding:28px 28px 24px;
  box-shadow:var(--shadow);
}

.banner::before,
.banner::after {
  content:"✦";
  position:absolute;
  color:rgba(217,182,108,.35);
  font-size:120px;
  line-height:1;
  font-family: Georgia, serif;
}

.banner::before { right:24px; top:-10px; transform:rotate(8deg); }
.banner::after { left:18px; bottom:-34px; transform:rotate(-8deg); font-size:92px; }

.kicker {
  display:inline-flex;
  align-items:center;
  gap:10px;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.22em;
  color:#ecd59e;
  font-weight:700;
  margin-bottom:8px;
}

.kicker::before, .kicker::after {
  content:"";
  width:28px;
  height:1px;
  background:linear-gradient(90deg, transparent, #d9b66c, transparent);
}

h1 {
  margin:0;
  font-family: Georgia, "Times New Roman", serif;
  font-size:clamp(34px, 5vw, 56px);
  line-height:1.02;
  letter-spacing:-.03em;
}

.banner p {
  margin:12px 0 0;
  color:#d5dbee;
  font-size:17px;
  max-width:780px;
}

.toolbar {
  margin:22px 0 20px;
  background:rgba(7,11,21,.38);
  border:1px solid rgba(217,182,108,.3);
  border-radius:20px;
  padding:16px;
  box-shadow:var(--shadow);
  backdrop-filter: blur(8px);
}

.search {
  width:100%;
  padding:17px 18px;
  font-size:17px;
  border-radius:16px;
  border:1px solid rgba(184,138,53,.38);
  background:linear-gradient(180deg, #fbf7ee, #efe6d1);
  color:var(--ink);
  outline:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7);
}

.search:focus {
  border-color:var(--gold-deep);
  box-shadow:0 0 0 4px rgba(217,182,108,.22), inset 0 1px 0 rgba(255,255,255,.7);
}

.grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:16px;
}

.unit {
  position:relative;
  background:linear-gradient(180deg, var(--panel-2), var(--panel));
  border:1px solid #d8c497;
  border-radius:22px;
  padding:14px;
  min-height:104px;
  display:flex;
  align-items:center;
  gap:14px;
  width:100%;
  text-align:left;
  cursor:pointer;
  box-shadow:0 10px 24px rgba(0,0,0,.12);
  transition:transform .14s ease, box-shadow .14s ease, border-color .14s ease;
}

.unit::before {
  content:"";
  position:absolute;
  inset:8px;
  border-radius:16px;
  border:1px solid rgba(117,81,24,.14);
  pointer-events:none;
}

.unit:hover {
  transform:translateY(-3px);
  box-shadow:0 18px 28px rgba(0,0,0,.17);
  border-color:#c79a4a;
}

.portrait {
  position:relative;
  width:72px;
  height:72px;
  flex:0 0 auto;
  border-radius:18px;
  overflow:hidden;
  border:2px solid var(--gold);
  background:linear-gradient(180deg, #dce7fa, #bacbe8);
  box-shadow:0 5px 12px rgba(33,46,79,.18);
}

.portrait.small {
  width:58px;
  height:58px;
  border-radius:16px;
}

.portrait.hero {
  width:104px;
  height:104px;
  border-radius:24px;
  border-width:3px;
}

.portrait img {
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center 15%;
  display:block;
  position:relative;
  z-index:2;
}

.fallback {
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  font-family: Georgia, serif;
  font-weight:700;
  color:#355a99;
  font-size:26px;
  z-index:1;
}

.small .fallback { font-size:20px; }
.hero .fallback { font-size:38px; }

.name {
  font-family: Georgia, "Times New Roman", serif;
  font-size:24px;
  line-height:1.05;
  font-weight:700;
  color:#1d2740;
}

.count {
  margin-top:8px;
  font-size:13px;
  color:var(--muted);
  font-weight:600;
}

.detail { display:none; }
.detail.active { display:block; }
.home.hidden { display:none; }

.back {
  appearance:none;
  border:1px solid rgba(217,182,108,.45);
  background:linear-gradient(180deg, #2c4068, #1b2743);
  color:#f8f3e7;
  padding:13px 18px;
  border-radius:15px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  box-shadow:var(--shadow);
  margin-bottom:16px;
}

.back:hover {
  filter:brightness(1.06);
}

.hero-card {
  position:relative;
  background:linear-gradient(180deg, #fbf7ed, #f1e8d6);
  border:1px solid #d8c497;
  border-radius:26px;
  padding:22px;
  display:flex;
  align-items:center;
  gap:18px;
  margin-bottom:18px;
  box-shadow:0 18px 34px rgba(0,0,0,.14);
}

.hero-card::after {
  content:"";
  position:absolute;
  inset:9px;
  border:1px solid rgba(117,81,24,.14);
  border-radius:18px;
  pointer-events:none;
}

.hero-card h2 {
  margin:0;
  font-family: Georgia, "Times New Roman", serif;
  font-size:clamp(32px, 5vw, 44px);
  color:#1b2743;
}

.hero-card .sub {
  margin-top:8px;
  color:var(--muted);
  font-size:15px;
}

.support-list {
  display:grid;
  gap:12px;
}

.support-row {
  background:linear-gradient(180deg, #fbf7ed, #f1e8d6);
  border:1px solid #d8c497;
  border-radius:20px;
  padding:12px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  box-shadow:0 8px 20px rgba(0,0,0,.09);
}

.person-link {
  display:flex;
  align-items:center;
  gap:12px;
  text-decoration:none;
  color:inherit;
  border-radius:14px;
  padding:5px 7px;
  margin:-5px -7px;
  transition:background .12s ease, transform .12s ease;
}

.person-link:hover {
  background:rgba(53,93,164,.08);
  transform:translateX(2px);
}

.person-name {
  font-family: Georgia, "Times New Roman", serif;
  font-weight:700;
  font-size:21px;
  color:#1f2942;
}

.badges {
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  justify-content:flex-end;
}

.badge {
  min-width:44px;
  height:44px;
  padding:0 11px;
  border-radius:999px;
  display:grid;
  place-items:center;
  color:white;
  font-weight:900;
  font-size:18px;
  border:2px solid rgba(255,255,255,.35);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.24), 0 5px 10px rgba(0,0,0,.14);
}

.badge.A { background:linear-gradient(180deg, #458b6f, #30654f); }
.badge.B { background:linear-gradient(180deg, #d0a74f, #a77a26); }
.badge.C { background:linear-gradient(180deg, #8e6ac2, #6d4b9a); }
.badge.Q { background:linear-gradient(180deg, #7f858f, #5f6570); }

.note-panel {
  margin-top:20px;
  background:rgba(9,14,28,.35);
  border:1px solid rgba(217,182,108,.25);
  color:#dce3f3;
  border-radius:18px;
  padding:16px 18px;
  font-size:13px;
  line-height:1.55;
  box-shadow:var(--shadow);
}

.note-panel strong {
  color:#f3dfad;
}

.footer-space { height:10px; }

@media (max-width: 780px) {
  .shell { padding:20px 14px 34px; }
  .banner { padding:22px 18px 20px; }
  .toolbar { padding:12px; }
  .grid { grid-template-columns:1fr 1fr; gap:12px; }
  .unit { min-height:90px; padding:10px; gap:10px; }
  .portrait { width:60px; height:60px; border-radius:16px; }
  .name { font-size:19px; }
  .hero-card { align-items:flex-start; }
  .support-row { align-items:flex-start; flex-direction:column; }
  .badges { justify-content:flex-start; }
}

@media (max-width: 520px) {
  .grid { grid-template-columns:1fr; }
}

.profile-info{display:grid;grid-template-columns:1fr 1.25fr;gap:16px;margin-bottom:18px}
.info-card{background:linear-gradient(180deg,#fbf7ed,#f1e8d6);border:1px solid #d8c497;border-radius:20px;padding:18px;box-shadow:0 8px 20px rgba(0,0,0,.09)}
.info-card h3{margin:0 0 12px;font-family:Georgia,"Times New Roman",serif;color:#1b2743;font-size:23px}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:rgba(255,255,255,.5);border:1px solid rgba(184,138,53,.26);border-radius:12px;padding:9px 10px;display:flex;justify-content:space-between;gap:8px}
.stat-name{color:#686f7c;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}.stat-value{color:#1b2743;font-weight:900}
.info-note{margin-top:10px;color:#6b6f79;font-size:12px;line-height:1.45}.recruit-list{display:grid;gap:8px}
.recruit-item{background:rgba(255,255,255,.48);border:1px solid rgba(184,138,53,.22);border-radius:12px;padding:10px 11px;line-height:1.35}
.recruit-label{display:block;color:#9a6d22;font-weight:900;font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.source-link{display:inline-block;margin-top:10px;color:#355a99;font-size:12px;font-weight:700}.section-heading{margin:20px 0 10px;color:#f3dfad;font-family:Georgia,"Times New Roman",serif;font-size:25px}
@media(max-width:780px){.profile-info{grid-template-columns:1fr}.stat-grid{grid-template-columns:repeat(3,1fr)}}

</style>
</head>

const STAT_NAMES=['HP','Str','Mag','Spd','Dex','Def','Res','Lck','Cha'];

const home = document.getElementById('home');
const detail = document.getElementById('detail');
const grid = document.getElementById('grid');
const search = document.getElementById('search');
const back = document.getElementById('back');
const detailContent = document.getElementById('detailContent');

function initials(name) {
  const p = name.trim().split(/\s+/);
  return p.length > 1 ? (p[0][0] + p[p.length - 1][0]).toUpperCase() : name[0].toUpperCase();
}

function slug(name) {
  if (ASSET_ALIAS[name]) return ASSET_ALIAS[name];
  return name.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-|-$/g, '');
}

function portrait(name, cls='') {
  const s = slug(name);
  const src = `https://ffrecruiter.lovable.app/portraits/${s}.webp`;
  return `<span class="portrait ${cls}">
    <span class="fallback">${initials(name)}</span>
    <img src="${src}" alt="${name}" loading="lazy" onerror="this.style.display='none'">
  </span>`;
}

function badge(x) {
  return `<span class="badge ${x === '?' ? 'Q' : x}">${x}</span>`;
}

function rankSequence(maxRank) {
  if (maxRank === 'A') return ['C', 'B', 'A'];
  if (maxRank === 'B') return ['C', 'B'];
  if (maxRank === 'C') return ['C'];
  return [maxRank];
}

function supportLink(name) {
  return `<a href="#" class="person-link" data-character="${name}">
    ${portrait(name, 'small')}
    <span class="person-name">${name}</span>
  </a>`;
}

function renderGrid(q='') {
  q = q.trim().toLowerCase();
  grid.innerHTML = '';
  DATA.names
    .filter(n => n.toLowerCase().includes(q))
    .forEach(name => {
      const button = document.createElement('button');
      button.className = 'unit';
      button.innerHTML = `
        ${portrait(name)}
        <span>
          <div class="name">${name}</div>
          <div class="count">${DATA.supports[name].length} supports</div>
        </span>
      `;
      button.onclick = () => showDetail(name);
      grid.appendChild(button);
    });
}

function wireSupportLinks() {
  detailContent.querySelectorAll('.person-link').forEach(link => {
    link.addEventListener('click', (e) => {
      e.preventDefault();
      showDetail(link.dataset.character);
    });
  });
}


function growthCard(name){
 const vals=GROWTH[name];
 if(!vals)return `<div class="info-card"><h3>Growth Rates</h3><div class="info-note">No growth-rate entry found.</div></div>`;
 const stats=vals.map((v,i)=>`<div class="stat"><span class="stat-name">${STAT_NAMES[i]}</span><span class="stat-value">${v}%</span></div>`).join('');
 const mu=name==='Mu'?`<div class="info-note"><strong>Signs of Growth active:</strong> HP 50% · Str 50% · Mag 25% · Spd 50% · Dex 50% · Def 40% · Res 30% · Lck 30% · Cha 40%</div>`:'';
 return `<div class="info-card"><h3>Growth Rates</h3><div class="stat-grid">${stats}</div><div class="info-note">Personal growth rates. Add class growth rates for the full in-class growth rates.</div>${mu}<a class="source-link" href="https://serenesforest.net/fortunes-weave/characters/growth-rates/" target="_blank" rel="noopener">Source: Serenes Forest ↗</a></div>`;
}
function recruitmentCard(name){
 const r=RECRUITMENT[name];
 if(!r)return `<div class="info-card"><h3>Recruitment</h3><div class="info-note">No recruitment entry was found for this character on the Serenes Forest page.</div><a class="source-link" href="https://serenesforest.net/fortunes-weave/characters/recruitment/" target="_blank" rel="noopener">Source: Serenes Forest ↗</a></div>`;
 const items=r.items.map(x=>`<div class="recruit-item"><span class="recruit-label">${x.label}</span>${x.text}</div>`).join('');
 return `<div class="info-card"><h3>Recruitment</h3><div class="recruit-list">${items}</div>${r.note?`<div class="info-note">${r.note}</div>`:''}<a class="source-link" href="https://serenesforest.net/fortunes-weave/characters/recruitment/" target="_blank" rel="noopener">Source: Serenes Forest ↗</a></div>`;
}

function showDetail(name) {
  home.classList.add('hidden');
  detail.classList.add('active');

  const list = DATA.supports[name];

  detailContent.innerHTML = `
    <div class="hero-card">
      ${portrait(name, 'hero')}
      <div>
        <h2>${name}</h2>
        <div class="sub">${list.length} support relationship${list.length === 1 ? '' : 's'}</div>
      </div>
    </div>

    <div class="profile-info">
      ${growthCard(name)}
      ${recruitmentCard(name)}
    </div>

    <div class="section-heading">Supports</div>
    <div class="support-list">
      ${list.map(s => `
        <div class="support-row">
          <div>${supportLink(s.name)}</div>
          <div class="badges">${rankSequence(s.levels[s.levels.length - 1]).map(badge).join('')}</div>
        </div>
      `).join('')}
    </div>
  `;

  wireSupportLinks();
  scrollTo({ top:0, behavior:'smooth' });
}

back.onclick = () => {
  detail.classList.remove('active');
  home.classList.remove('hidden');
  scrollTo({ top:0, behavior:'smooth' });
};

search.oninput = e => renderGrid(e.target.value);
renderGrid();
</script>
